server {
    listen 80 default_server;

    server_name
        localhost
        working.system-samt.com
        _;

    # เรียก API ผ่าน origin เดียวกับหน้าเว็บเสมอ (relative /api/) แทนการยิงตรงไป
    # IP:port ของ working-api จาก browser ตรงๆ เพราะ browser จะบล็อก request แบบนั้น
    # (Private/Local Network Access) เมื่อหน้าเว็บถูกเปิดจาก IP วงอื่นที่ไม่ใช่วงเดียวกับ working-api
    # nginx เป็นคน proxy ต่อให้แทน ซึ่งเป็นการเชื่อมต่อฝั่ง server ไม่โดนข้อจำกัดนี้
    location /api/ {
        proxy_pass http://host.docker.internal:5001/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # เช่นเดียวกับ /api/ แต่ปลายทางเป็นระบบภายนอกจริง (em-backend.system-samt.com) ที่ browser
    # ของ client อาจเข้าอินเทอร์เน็ตไม่ได้ (เช่นเครื่องที่อยู่ใน LAN แยกไม่มี internet) เครื่อง server
    # ที่รัน nginx มีอินเทอร์เน็ตออกได้เอง เลยให้ nginx เป็นคนยิง HTTPS ออกไปแทน client
    location /eis-api/ {
        proxy_pass https://em-backend.system-samt.com/api/;
        proxy_ssl_server_name on;
        # ต้องส่ง Host ของปลายทางจริง ไม่ใช่ Host ที่ client เรียกเข้ามา (เช่น 203.144.243.99:8080)
        # ไม่งั้นปลายทางจะ route/ตรวจ SNI ผิด
        proxy_set_header Host em-backend.system-samt.com;

        proxy_http_version 1.1;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://nextjs:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}