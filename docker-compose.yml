services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # เป็น path แบบ relative (ไม่ผูก IP ใด IP หนึ่ง) ให้ browser ยิงไปที่ origin เดียวกับ
        # หน้าเว็บเสมอ แล้วให้ nginx (ดู nginx/default.conf location /api/) proxy ต่อไปหา
        # working-api ให้แทน เพราะถ้า hardcode เป็น IP วงใดวงหนึ่ง client ที่เข้าเว็บจาก IP/วง LAN
        # อื่นจะโดน browser บล็อก request (Private/Local Network Access) แก้แล้วต้อง
        # docker compose build (ไม่ใช่แค่ up) ใหม่เสมอ เพราะถูกฝังตอน build
        NEXT_PUBLIC_API_BASE_URL: /api/
        NEXT_PUBLIC_API_EIS_URL: https://em-backend.system-samt.com/api/
    container_name: working-report-nextjs

    environment:
      NODE_ENV: production

    expose:
      - "3000"

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: working-report-nginx

    ports:
      # เครื่องนี้มี Apache/AppServ จับพอร์ต 80 อยู่ก่อนแล้ว (เห็นได้จาก "Index of /"
      # ตอนเข้า localhost) เลยใช้พอร์ต 8080 แทนฝั่ง host ไม่ไปแตะ 80 เดิม
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - nextjs

    extra_hosts:
      # ให้ nginx มองเห็น working-api ที่รันเป็น container แยก (คนละ compose project)
      # ผ่านพอร์ตที่ publish ไว้บนเครื่อง host (5001) แทน
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
