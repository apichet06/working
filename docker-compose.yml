services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # ต้องตรงกับ IP/host ที่เครื่องนี้เข้าถึง working-api ได้จริง แก้แล้วต้อง
        # docker compose build (ไม่ใช่แค่ up) ใหม่เสมอ เพราะถูกฝังตอน build
        NEXT_PUBLIC_API_BASE_URL: http://192.168.100.249:5001/api/
        NEXT_PUBLIC_API_EIS_URL: https://em-backend.system-samt.com/api/
    container_name: working-report-nextjs

    environment:
      NODE_ENV: production

    expose:
      - "3000"

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: working-report-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - nextjs

    restart: unless-stopped
