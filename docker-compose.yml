services:
  nextjs:
    image: node:22-alpine
    container_name: working-report-nextjs
    working_dir: /app

    command: >
      sh -c "npm install &&
             npm run dev -- --hostname 0.0.0.0"

    volumes:
      - .:/app
      - nextjs_node_modules:/app/node_modules
      - nextjs_cache:/app/.next

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"

    expose:
      - "3000"

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: working-report-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - nextjs

    restart: unless-stopped

volumes:
  nextjs_node_modules:
  nextjs_cache: